server:
  port: 8082
  servlet:
    context-path: /api

spring:
  application:
    name: sports-rehabilitation-platform
  
  # 数据库配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/sports_rehabilitation?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: root
    password: ${DB_PASSWORD:}
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 100
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1 FROM DUAL
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin
      filter:
        stat:
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: false
        wall:
          config:
            multi-statement-allow: true

  # Redis配置
  redis:
    host: localhost
    port: 6379
    password: 
    timeout: 10000ms
    jedis:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

# 日志配置
logging:
  level:
    com.rehabilitation: debug
    org.springframework: warn
    com.alibaba.druid: debug
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{20} - [%method,%line] - %msg%n"

# Knife4j配置
knife4j:
  enable: true
  openapi:
    title: 运动康复医疗管理平台API文档
    description: "运动康复医疗管理平台后端接口文档"
    version: 1.0.0
    concat: admin@rehabilitation.com
  setting:
    language: zh_cn

# 自定义配置
rehabilitation:
  # 文件存储路径
  file:
    upload-path: /uploads/
    static-path: /static/
  # JWT配置
  jwt:
    secret: ${JWT_SECRET:}
    expiration: 86400000  # 24小时
  # 分页配置
  page:
    default-size: 10
    max-size: 100
  # 阿里云OSS配置
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucket-name: sports-rehabilitation
    region: cn-beijing
    access-key-id: YOUR_ACCESS_KEY_ID_REPLACED  # 请替换为实际的AccessKeyId
    access-key-secret: YOUR_ACCESS_KEY_SECRET_REPLACED  # 请替换为实际的AccessKeySecret
    base-url: https://sports-rehabilitation.oss-cn-beijing.aliyuncs.com  # OSS访问域名
    folder: exercise-images/  # 图片存储文件夹